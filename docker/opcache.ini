opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; validate_timestamps=1 a proposito: el droplet es de 1 core y compartido con
; pos-saas. Ponerlo en 0 exige reiniciar php-fpm en cada deploy, y un deploy
; que se olvide deja la app sirviendo codigo viejo sin ninguna senal.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
