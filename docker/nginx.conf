server {
    # 8030, no 80: el contenedor corre con la red del host y ahi el 80 ya es
    # del nginx del sistema que sirve pos-saas. El TLS lo termina ese nginx,
    # que hace proxy_pass a este puerto.
    listen 8030;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
