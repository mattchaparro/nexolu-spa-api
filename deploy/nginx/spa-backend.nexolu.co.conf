# nexolu-spa-api (Laravel) -> contenedor nexolu-spa-api en 127.0.0.1:8030.
#
# Va en /etc/nginx/sites-available/ del droplet legacy `nexolu`, el mismo
# nginx que ya sirve pos.nexolu.co, api-admin.nexolu.co y admin.nexolu.co.
# certbot corre en modo --nginx y edita este archivo para agregar el bloque
# 443 y los certificados.
#
# Este archivo vive en el repo a proposito. Los vhosts de nexolu-admin solo
# existen en el servidor: si ese droplet se pierde, hay que reconstruirlos
# de memoria. Aca no.
server {
    listen 80;
    server_name spa-backend.nexolu.co;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
